<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeverRender Labs</title>
    <meta name="description" content="Agent Assisted Creative Studio - Surreal-Futurist Macro-Diorama">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon-svg.svg">
</head>
<body>
    <div class="macro-environment">
        <!-- Background plate for bokeh/blur -->
        <div class="background-plate"></div>
        
        <!-- Energy Conduits -->
        <div class="conduit-grid">
            <div class="conduit-line horizontal top"></div>
            <div class="conduit-line vertical left"></div>
            <div class="conduit-line horizontal bottom"></div>
            <div class="conduit-line vertical right"></div>
        </div>

        <!-- Central Crystalline Viewport -->
        <div class="viewport-container" id="main-viewport">
            <div class="glass-panel">
                <header class="sys-header">
                    <div class="sys-status">
                        <span class="indicator blink"></span> SYSTEM STATUS: CEMENTED
                    </div>
                    <div class="sys-id">PROJECT_NEVERMORE</div>
                </header>

                <main class="content-matrix">
                    <div style="display: flex; justify-content: center; margin-bottom: 6px;">
                        <a href="https://labs.google/fx/tools/flow/shared/tool/c718f343-2e2f-4ae8-92bd-6f68f13b1c45" target="_blank" rel="noopener" style="text-decoration: none;">
                            <span style="display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.68rem; color: var(--color-marquee-gold); background: rgba(254, 227, 120, 0.12); border: 1px solid var(--color-marquee-gold); padding: 4px 12px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px;">
                                ★ GOOGLE LABS FLOW FEATURED: RETRO-TERM 80
                            </span>
                        </a>
                    </div>

                    <h1 class="chromatic-aberration">NEVERRENDER LABS</h1>
                    <p class="subtitle">MASTER SYSTEM &amp; MACHINE LEARNING COMPENDIUM (AUG 2026)</p>
                    
                    <div class="terminal-box" id="terminal-interface">
                        <div class="terminal-header">
                            <span>> TERMINAL FOCUS // SRE KERNEL</span>
                        </div>
                        <div class="terminal-body">
                            <p class="typewriter-text" id="typewriter"></p>
                            <span class="cursor">_</span>
                        </div>
                    </div>

                    <!-- Primary Mission Launchers -->
                    <div style="margin-top: 10px; width: 100%; display: flex; flex-direction: column; gap: 6px;">
                        <button class="action-btn" style="width: 100%; border-color: var(--color-energy-cyan); background: rgba(137, 236, 164, 0.15); color: var(--color-energy-cyan); text-shadow: 0 0 8px rgba(137, 236, 164, 0.6); font-weight: bold; letter-spacing: 2px;" onclick="window.location.href='resume.html'">[▶] VIEW 8-BIT RESUME &amp; CREATIVE DOSSIER [◀]</button>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                            <button class="action-btn" style="border-color: var(--color-marquee-gold); color: var(--color-marquee-gold); background: rgba(254, 227, 120, 0.08); font-size: 0.7rem;" onclick="window.location.href='wellgreens-scanner.html'">[🌿] AI INTAKE SCANNER</button>
                            <button class="action-btn" style="border-color: var(--color-retro-coral); color: var(--color-retro-coral); background: rgba(250, 104, 116, 0.08); font-size: 0.7rem;" onclick="window.location.href='wellgreens-vista/'">[🛒] VISTA KIOSK &amp; CART</button>
                        </div>
                    </div>

                    <div class="action-matrix">
                        <button class="action-btn secondary" id="view-archives">VIEW ARCHIVES</button>
                        <button class="action-btn secondary" id="view-characters" onclick="window.location.href='characters.html'">CHARACTERS</button>
                        <button class="action-btn secondary" id="view-stills" onclick="window.location.href='still-edits.html'">STILL EDITS</button>
                        <button class="action-btn secondary" id="view-tech-logs" onclick="window.location.href='tech-logs.html'">TECH LOGS</button>
                        <button class="action-btn secondary" id="view-notebook-research" onclick="window.location.href='notebook-research.html'">RESEARCH</button>
                        <button class="action-btn secondary" id="contact-creator">CONTACT</button>
                    </div>
                </main>

                <footer class="sys-footer">
                    <div>COMPUTE: TUNED AMD 6800U</div>
                    <div class="text-pop">AESTHETIC: SURREAL-FUTURIST MACRO-DIORAMA</div>
                </footer>
            </div>
        </div>
    </div>
    <div class="video-modal" id="archive-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-panel extended-modal">
            <header class="sys-header">
                <div class="sys-id">ARCHIVE_PLAYBACK</div>
                <button class="close-btn" id="close-modal">[X] CLOSE</button>
            </header>
            <div class="archive-layout">
                <div class="playlist-sidebar">
                    <button class="playlist-btn active" data-type="local" data-src="FLOW_TO_THE_MUSIC/BURRIED_IN_BUREAUCRACY_MOBILE.mp4">BURIED IN BUREAUCRACY</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/A_CLOCKWOR_INQUIRY/A_CLOCKWORK_INQUIRY_MOBILE.mp4">A CLOCKWORK INQUIRY</button>
                    <button class="playlist-btn" data-type="youtube" data-src="https://www.youtube.com/embed/zQM6iV-Fs0U?autoplay=1">A CLOCKWORK INQUIRY (YT SHORT)</button>
                    <button class="playlist-btn" data-type="youtube" data-src="https://www.youtube.com/embed/j6G2yc-H05A?autoplay=1">THE AWAKENING</button>
                    <button class="playlist-btn" data-type="youtube" data-src="https://www.youtube.com/embed/LArgW7CPEc4?autoplay=1">BUREAU OF UNNECESSARY CELEBRATIONS</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/VAPORWAVE_PIERSIDE/VAPORWAVE_PIERSIDE_WEBSITE.mp4">VAPORWAVE PIERSIDE</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/BOUNDARY_CROSSOVER/BOUNDARY_CROSSOVER-WEB.mp4">BOUNDARY CROSSOVER</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/THE_CHRONO_JUMP/THE_CHRONO_JUMP.mp4">THE CHRONO JUMP</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/UNICORNS_ARE_REAL/UNICORNS_ARE_REAL_MOBILE.mp4">UNICORNS ARE REAL</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/WOOLY_FINGERS/MICRO_WOOL_MACRO_CITY_POST_SMALL.mp4">WOOLY FINGERS</button>
                    <button class="playlist-btn" data-type="local" data-src="MOTION_EDITS/OSIDE_SENDAI_HYPER_DROP/OSIDE_SENDAI_HYPER_DROP_MOBILE.mp4">OSIDE SENDAI HYPER DROP</button>
                </div>
                <div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0;">
                    <video id="launch-video" controls style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                        <source src="FLOW_TO_THE_MUSIC/BURRIED_IN_BUREAUCRACY_MOBILE.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <iframe id="youtube-player" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
